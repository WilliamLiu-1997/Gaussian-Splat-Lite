[workspace]
members = [
    "gaussian-splat-rs",
    "gaussian-splat-lib",
    "gaussian-splat-cluster",
]
resolver = "2"

[workspace.package]
rust-version = "1.87"
edition = "2021"
license = "Apache-2.0"
authors = ["William Liu <lyz15972107087@gmail.com>"]
repository = "https://github.com/WilliamLiu-1997/Gaussian-Splat-Lite"

[workspace.dependencies]
anyhow = "1.0.98"
crc32fast = "1.5.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
half = { version = "2.6.0", features = ["std"] }
js-sys = "0.3.77"
ruzstd = { version = "0.9.0", default-features = false, features = ["std", "hash"] }
wasm-bindgen = "0.2.100"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
